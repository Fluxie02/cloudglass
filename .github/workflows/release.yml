name: Release

# Builds the installers from the tagged source, publishes SHA-256 checksums and
# a signed build-provenance attestation, then creates the GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build installers
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Write checksums
        shell: bash
        run: cd dist && sha256sum *.exe | tee SHA256SUMS.txt

      # Artifact attestations are free for public repositories; skipped while private.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.exe

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/SHA256SUMS.txt \
            --title "Cloudglass $GITHUB_REF_NAME" \
            --notes "Unofficial build; not affiliated with or endorsed by SoundCloud. Verify downloads with SHA256SUMS.txt or 'gh attestation verify <file> --repo $GITHUB_REPOSITORY'." \
            --verify-tag
